[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "startrekdec"
version = "0.1.0"
description = "Decompiler for the PSP Kirk and Spock crypto processors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "zecoxao" }]
keywords = ["psp", "kirk", "spock", "decompiler", "ida", "reverse-engineering"]

[project.urls]
Homepage = "https://github.com/zecoxao/startrekdec"

[project.scripts]
startrekdec = "startrekdec.cli:main"

[tool.setuptools]
packages = ["startrekdec"]
py-modules = ["startrekdec_plugin"]
